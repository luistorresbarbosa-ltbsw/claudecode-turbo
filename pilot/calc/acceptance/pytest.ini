# Configuração própria da aceitação escondida. Sem este ficheiro, o pytest subia até ao
# pyproject.toml da raiz do repositório e usava-o (rootdir, conftest, addopts, filterwarnings):
# uma alteração lá podia mudar o resultado da aceitação. Este ficheiro corta essa ligação.
[pytest]
markers =
    tempo_maximo(segundos): limite de tempo de um teste, em vez dos 10 s por defeito (conftest.py)
