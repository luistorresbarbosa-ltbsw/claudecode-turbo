[project]
name = "jev"
version = "0.1.0"
description = "JEV: escolhe o modelo e o esforço certos para cada tarefa, e mostra quanto poupaste."
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.50",
    "python-dotenv>=1.0",
]

[project.scripts]
jev = "jev.cli:main"
jev-dashboard = "jev.dashboard:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # interno do litellm/pydantic, não é código nosso
    "ignore:Item 'summary' on TypedDict class 'ChatCompletionReasoningItem':UserWarning",
]
