[project]
name = "jev"
version = "0.2.1"
description = "JEV: escolhe o modelo e o esforço certos para cada tarefa, e mostra quanto poupaste."
requires-python = ">=3.12,<3.14"  # o litellm depende do fastuuid, sem rodas prontas para 3.14+
dependencies = [
    "litellm>=1.50",
    "python-dotenv>=1.0",
]

[project.scripts]
jev = "jev.cli:main"
jev-dashboard = "jev.dashboard:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev"]

# o dashboard instalado com `uv tool install` precisa da página, que no repositório vive em dashboard/
[tool.hatch.build.targets.wheel.force-include]
"dashboard/index.html" = "jev/dashboard_index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # interno do litellm/pydantic, não é código nosso
    "ignore:Item 'summary' on TypedDict class 'ChatCompletionReasoningItem':UserWarning",
]
